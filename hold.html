  <meta name="robots" content="noindex, nofollow" />
  <title>RoboForge — вход</title>
  <!--
    Экран входа. Шаблон для publish.ps1: тот подставляет зашифрованную страницу
    в #lts-data. PBKDF2-SHA256 → 64 байта: AES-256-CBC (0..31) + HMAC-SHA256 (32..63),
    MAC считается по iv||ct. Ключ после входа лежит в sessionStorage,
    с «Запомнить» — ещё и в localStorage; привязан к соли, смена пароля его сбрасывает.
    Скрипт без let/const на верхнем уровне: document.open() оставляет window,
    иначе имена столкнутся со скриптом страницы.
    UI: скил robokassa-lts-ui.
  -->
  <script>try { if (localStorage.getItem("lts-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}</script>
  <style>
    :root {
      --bg: #f4efe9;
      --paper: #fffdfb;
      --ink: #1f1a17;
      --muted: #6b615a;
      --line: #e6ddd4;
      --orange: #3f8a68;
      --orange-deep: #2e6f52;
      --err: #b42318;
      --sans: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
    .app { max-width: 1280px; margin: 0 auto; padding: 20px 16px 40px; }
    header.app-head { display: flex; align-items: center; margin-bottom: 16px; }
    .brand strong { font-size: 20px; letter-spacing: -0.03em; }
    .card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
      padding: 18px; box-shadow: 0 8px 24px rgba(31, 26, 23, 0.04);
    }
    .login { max-width: 380px; margin: 12vh auto 0; }
    h2 { margin: 0 0 14px; font-size: 16px; }
    .fields { display: grid; gap: 12px; }
    .row { display: grid; gap: 4px; }
    label { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.2; }
    input[type="password"], input[type="text"] {
      width: 100%; border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; font: 14px/1.4 var(--sans); background: #fff; color: var(--ink);
    }
    input:focus { outline: 2px solid #a7d3bd; border-color: var(--orange); }
    .pass-wrap { display: flex; gap: 8px; }
    .pass-wrap input { flex: 1; min-width: 0; }
    .check {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 13.5px; font-weight: 600;
      cursor: pointer;
    }
    button {
      border: 0; border-radius: 10px; padding: 10px 14px; font: 600 13px var(--sans);
      cursor: pointer; background: var(--ink); color: #fff;
    }
    button.primary { background: var(--orange); width: 100%; padding: 12px 14px; font-size: 14px; }
    button.primary:hover { background: var(--orange-deep); }
    button.ghost { background: #efe8e1; color: var(--ink); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .err { padding: 8px 10px; border-radius: 8px; font-size: 13px; background: #fef3f2; color: var(--err); }
    .hidden { display: none !important; }
    /* Логотип: Robo + Forge акцентом, справа наковальня из Minecraft (картинка пользователя: обрезана и уменьшена заранее под 1x/2x/3x — SVG-image мылил). Иконка вкладки — «графит» */
    .brand { display: inline-flex; align-items: center; gap: 8px; }
    .brand strong { font-size: 24px; }
    .brand .forge { color: var(--orange); }
    .brand .anvil { flex: none; }
    :root[data-theme="dark"] .brand .anvil { filter: drop-shadow(0 0 .6px #d8d0c8) drop-shadow(0 0 .6px #d8d0c8); }
    /* Тёмная тема: html[data-theme="dark"], кнопка #themeTg, выбор в localStorage "lts-theme". Блок одинаковый на всех страницах */
    .theme-tg {
      margin-left: auto; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 999px; cursor: pointer;
      display: inline-grid; place-items: center; background: #efe8e1; color: var(--ink);
    }
    .theme-tg:hover { background: #e6ddd4; }
    .theme-tg .sun, :root[data-theme="dark"] .theme-tg .moon { display: none; }
    :root[data-theme="dark"] .theme-tg .sun { display: block; }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141110; --paper: #1d1917; --ink: #ece4dc; --muted: #a0958c; --line: #342c27;
      --orange: #5fb591; --orange-deep: #86cdac;
      --ok: #4fcf8a; --warn: #f2b248; --err: #f27a6d; --chip: #1b2b24;
      --field: #25201d; --soft: #2d2622; --tint: #191513;
    }
    :root[data-theme="dark"] nav a.active { background: var(--ink); color: #1d1917; }
    :root[data-theme="dark"] .card, :root[data-theme="dark"] .cat,
    :root[data-theme="dark"] .search input { box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
    :root[data-theme="dark"] input[type="text"], :root[data-theme="dark"] input[type="password"],
    :root[data-theme="dark"] input[type="number"], :root[data-theme="dark"] input[type="email"],
    :root[data-theme="dark"] input[type="url"], :root[data-theme="dark"] select,
    :root[data-theme="dark"] textarea, :root[data-theme="dark"] .search input { background: var(--field); }
    :root[data-theme="dark"] input:focus, :root[data-theme="dark"] select:focus,
    :root[data-theme="dark"] textarea:focus { outline-color: #2c5a47; }
    :root[data-theme="dark"] input:disabled, :root[data-theme="dark"] select:disabled,
    :root[data-theme="dark"] textarea:disabled { background: var(--tint); color: #6f655e; }
    :root[data-theme="dark"] .check, :root[data-theme="dark"] .item-card,
    :root[data-theme="dark"] details.opt.nested.items, :root[data-theme="dark"] .html-preview { background: var(--field); }
    :root[data-theme="dark"] .fiscal-extra .check { background: transparent; }
    :root[data-theme="dark"] .item-card .item-card { background: var(--tint); }
    :root[data-theme="dark"] .check.live { background: rgba(242, 178, 72, .1); border-color: rgba(242, 178, 72, .35); }
    :root[data-theme="dark"] button, :root[data-theme="dark"] .btn { background: #3a322d; color: var(--ink); }
    :root[data-theme="dark"] button:hover { background: #453c36; }
    :root[data-theme="dark"] button.primary, :root[data-theme="dark"] .html-preview button[type="submit"] { background: var(--orange); color: #10201a; }
    :root[data-theme="dark"] button.primary:hover { background: #4ea07e; }
    :root[data-theme="dark"] button.ghost, :root[data-theme="dark"] .btn.ghost,
    :root[data-theme="dark"] .theme-tg { background: var(--soft); color: var(--ink); }
    :root[data-theme="dark"] button.ghost:hover, :root[data-theme="dark"] .theme-tg:hover { background: #3a322d; }
    :root[data-theme="dark"] details.opt:not(.sec):not(.nested) { background: var(--tint); border-color: #463c35; }
    :root[data-theme="dark"] .seg { background: var(--soft); }
    :root[data-theme="dark"] .seg button { background: transparent; }
    :root[data-theme="dark"] .seg button.on { background: #463c36; box-shadow: none; }
    :root[data-theme="dark"] .out { background: #0d0b0a; border: 1px solid var(--line); }
    :root[data-theme="dark"] .out.plain { background: var(--tint); color: var(--ink); }
    :root[data-theme="dark"] .parts code, :root[data-theme="dark"] .grp code { color: #9fd8bd; }
    :root[data-theme="dark"] .warn, :root[data-theme="dark"] .find.w,
    :root[data-theme="dark"] .stub-note { background: rgba(242, 178, 72, .1); }
    :root[data-theme="dark"] .err, :root[data-theme="dark"] .find.e,
    :root[data-theme="dark"] .sig-chip.bad { background: rgba(242, 122, 109, .12); }
    :root[data-theme="dark"] .ok, :root[data-theme="dark"] .find.o,
    :root[data-theme="dark"] .sig-chip.ok { background: rgba(79, 207, 138, .1); }
    :root[data-theme="dark"] .find.i { background: var(--tint); border-color: #4a4039; }
    :root[data-theme="dark"] .sig-chip.na, :root[data-theme="dark"] .search kbd,
    :root[data-theme="dark"] .m .tag { background: var(--soft); color: var(--muted); }
    :root[data-theme="dark"] .find code { background: rgba(255, 255, 255, .08); }
    :root[data-theme="dark"] .m + .m { border-top-color: #2a2420; }
    :root[data-theme="dark"] a.m:hover, :root[data-theme="dark"] a.m:focus-visible { background: #262019; }
    :root[data-theme="dark"] a.m.first { background: rgba(95, 181, 145, .1); }
    :root[data-theme="dark"] .m.soon b { color: #7d736b; }
    :root[data-theme="dark"] .m.soon code { color: #625951; }
  </style>
</head>
<body>

  <script>
  (function () {
    var KEY = "lts-key";
    var $ = function (id) { return document.getElementById(id); };
    var data = null;
    try { data = JSON.parse($("lts-data").textContent); } catch (e) {}

    function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
    function toB64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
    function store(kind) { try { return window[kind]; } catch (e) { return null; } }
    function getSaved() {
      var kinds = ["sessionStorage", "localStorage"];
      for (var i = 0; i < kinds.length; i++) {
        var s = store(kinds[i]);
        try {
          var v = s && JSON.parse(s.getItem(KEY) || "null");
          if (v && v.salt === data.salt) return v.key;
        } catch (e) {}
      }
      return null;
    }
    function save(key, remember) {
      var v = JSON.stringify({ salt: data.salt, key: key });
      try { store("sessionStorage").setItem(KEY, v); } catch (e) {}
      try {
        if (remember) store("localStorage").setItem(KEY, v);
        else store("localStorage").removeItem(KEY);
      } catch (e) {}
    }
    function forget() {
      try { store("sessionStorage").removeItem(KEY); } catch (e) {}
      try { store("localStorage").removeItem(KEY); } catch (e) {}
    }

    function derive(pass) {
      var enc = new TextEncoder().encode(pass);
      return crypto.subtle.importKey("raw", enc, "PBKDF2", false, ["deriveBits"]).then(function (base) {
        return crypto.subtle.deriveBits(
          { name: "PBKDF2", hash: "SHA-256", salt: b64(data.salt), iterations: data.it }, base, 512);
      }).then(toB64);
    }

    /* null — ключ не подошёл (MAC не сошёлся) */
    function decrypt(keyB64) {
      var raw = b64(keyB64), iv = b64(data.iv), ct = b64(data.ct);
      var signed = new Uint8Array(iv.length + ct.length);
      signed.set(iv); signed.set(ct, iv.length);
      return crypto.subtle.importKey("raw", raw.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"])
        .then(function (mk) { return crypto.subtle.verify("HMAC", mk, b64(data.mac), signed); })
        .then(function (ok) {
          if (!ok) return null;
          return crypto.subtle.importKey("raw", raw.slice(0, 32), "AES-CBC", false, ["decrypt"])
            .then(function (ak) { return crypto.subtle.decrypt({ name: "AES-CBC", iv: iv }, ak, ct); })
            .then(function (pt) { return new TextDecoder().decode(pt); });
        });
    }

    /* Пока парсер жив, document.open() игнорируется и write дописывает в хвост — ждём конца разбора */
    function show(html) {
      var swap = function () {
        document.open();
        document.write(html);
        document.close();
      };
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () { setTimeout(swap, 0); }, { once: true });
      } else {
        setTimeout(swap, 0);
      }
    }
    function msg(text) {
      $("formMsg").textContent = text;
      $("formMsg").classList.toggle("hidden", !text);
    }

    $("togglePass").addEventListener("click", function () {
      var el = $("pass");
      el.type = el.type === "password" ? "text" : "password";
      this.textContent = el.type === "password" ? "Показать" : "Скрыть";
    });

    $("loginForm").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var pass = $("pass").value;
      if (!data) return msg("Страница не собрана");
      if (!pass) return msg("Нужен пароль");
      if (!window.crypto || !crypto.subtle) return msg("Нужен https");
      msg("");
      $("enter").disabled = true;
      $("enter").textContent = "Проверяю…";
      var key;
      derive(pass).then(function (k) { key = k; return decrypt(k); }).then(function (html) {
        if (html === null) throw new Error("bad");
        save(key, $("remember").checked);
        show(html);
      }).catch(function () {
        $("enter").disabled = false;
        $("enter").textContent = "Войти";
        msg("Неверный пароль");
        $("pass").select();
      });
    });

    var saved = data && window.crypto && crypto.subtle && getSaved();
    if (saved) {
      $("loginForm").classList.add("hidden");
      var back = function () { forget(); $("loginForm").classList.remove("hidden"); };
      decrypt(saved).then(function (html) {
        if (html === null) back(); else show(html);
      }).catch(back);
    }
  })();
  </script>
  <script>
    (function () {
      var b = document.getElementById("themeTg");
      if (!b) return;
      b.addEventListener("click", function () {
        var root = document.documentElement, dark = root.getAttribute("data-theme") !== "dark";
        if (dark) root.setAttribute("data-theme", "dark"); else root.removeAttribute("data-theme");
        try { localStorage.setItem("lts-theme", dark ? "dark" : "light"); } catch (e) {}
      });
    })();
  </script>
